# GK-040: rclone config skeleton for backup target.
#
# Copy to deploy/backup/rclone.conf locally (gitignored) and fill in real
# credentials. The compose service mounts this file read-only into
# /home/backup/.config/rclone/rclone.conf inside the container.
#
# The backends below are interchangeable: pick one, point
# BACKUP_RCLONE_REMOTE at `<name>:membership_saas-backups/prod`, restart the
# backup service. Code does not need to change.
#
# GK-427 (2026-08-10) — WHAT IS ACTUALLY IN USE, AND WHY IT IS TEMPORARY.
#
# Live target is `[gdrive]`, on the MAINTAINER's personal Google account. This
# is INTERIM. The project's real target was `[r2]` on the CLIENT's Cloudflare
# account; that credential was revoked at Cloudflare's end and only the client
# can reissue it, so backups were repointed to storage we control rather than
# left sitting on the database host.
#
# At handoff this MUST move to client-owned storage — see
# docs/runbooks/backup_restore.md and the handoff task in
# docs/planning/implementation_tasks.md. Until then the client's data lives on
# a personal account, which is a governance problem even though the payload is
# encrypted before it ever leaves the host.
#
# Retention differs by backend, and getting this wrong means either unbounded
# growth or deleted backups:
#   - S3 / R2 / B2 → leave BACKUP_REMOTE_RETENTION_DAYS UNSET and configure a
#     bucket lifecycle rule. Storage-side expiry cannot be broken by a bug in
#     our script.
#   - Google Drive → has NO lifecycle policies. Set
#     BACKUP_REMOTE_RETENTION_DAYS or old copies accumulate forever.

; ---------------------------------------------------------------------------
; CURRENT LIVE TARGET (interim — see the note above).
;
; Do not hand-write this block. Generate it, because the token is an OAuth
; blob with a refresh token in it:
;
;   rclone authorize "drive" --drive-scope drive.file
;
; That prints a link, you approve it in a browser, and it hands back the
; `token = {...}` line to paste in here. If the machine running rclone has no
; browser (e.g. the server), forward the callback port from a machine that
; does: ssh -L 53682:127.0.0.1:53682 <server>, then open the printed link
; locally. Full walkthrough in docs/runbooks/backup_restore.md.
;
; scope = drive.file is deliberate and worth keeping: rclone can then see
; ONLY the files it created itself, never the rest of that Google account.
[gdrive]
type = drive
scope = drive.file
token = REPLACE_ME_RCLONE_AUTHORIZE_JSON_BLOB

[s3]
type = s3
provider = AWS
access_key_id = REPLACE_ME_AWS_ACCESS_KEY
secret_access_key = REPLACE_ME_AWS_SECRET_KEY
region = eu-central-1
server_side_encryption = AES256
storage_class = STANDARD_IA

; NOT IN USE since 2026-08-09 — the client-account credential behind this was
; revoked at Cloudflare's end. Kept as a template only. The live server config
; had its [r2] block DELETED rather than commented out: a dead credential that
; still looks live is what let the failure hide.
[r2]
type = s3
provider = Cloudflare
access_key_id = REPLACE_ME_R2_ACCESS_KEY
secret_access_key = REPLACE_ME_R2_SECRET_KEY
# Find the endpoint in the Cloudflare R2 dashboard per account.
endpoint = REPLACE_ME_R2_ENDPOINT
acl = private

[b2]
type = b2
account = REPLACE_ME_B2_KEYID
key = REPLACE_ME_B2_APP_KEY
hard_delete = true
