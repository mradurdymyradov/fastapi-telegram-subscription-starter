name: CI

# CI for the fastapi-telegram-subscription-starter monorepo.
# - backend: ruff lint + pytest (fully mocked suite, no external services needed)
# - frontend: typecheck + production build for both Next.js apps (admin, portal)
# - docker-smoke: build runtime container images to verify Dockerfiles

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Ruff lint
        run: >-
          ruff check . ../deploy/scripts/update_prelaunch_allowlist.py
          ../deploy/tests/test_update_prelaunch_allowlist.py

      - name: Pytest
        run: python -m pytest tests -q

      - name: Deployment helper tests
        run: python -m unittest discover -s ../deploy/tests -p 'test_*.py'

  frontend:
    name: Frontend (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [admin, portal]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npx --no-install tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  docker-smoke:
    name: Docker build smoke
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Backend image (runtime target)
        run: |
          mkdir -p backend/.wheelhouse
          docker build --target runtime -t fastapi-telegram-subscription-starter-backend:ci backend

      - name: Admin image
        run: docker build -t fastapi-telegram-subscription-starter-admin:ci admin

      - name: Portal image
        run: docker build -t fastapi-telegram-subscription-starter-portal:ci portal
